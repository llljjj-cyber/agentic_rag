worker_processes auto;

events {
    worker_connections 4096;
}

http {
    client_max_body_size 6M;

    upstream api_backend {
        least_conn;
        server backend:8897 max_fails=3 fail_timeout=10s;
    }

    upstream frontend {
        server frontend:80;
    }

    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=100r/s;
    limit_req_status 429;

    access_log /var/log/nginx/access.log;

    server {
        listen 80;
        server_name _;

        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

         location /health {
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
        }
        location /chat/stream {
            limit_req zone=per_ip burst=50 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }
        location ~ ^/(auth|sources|conversations|shelves|chat|space)(/|$) {
            limit_req zone=per_ip burst=200 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 120s;
        }
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
        }
    }
}
