name: CI and Deploy to ECS

on:
  push:
    branches:
      - newfrontend

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/llljjj-cyber/mar-backend
  FRONTEND_IMAGE: ghcr.io/llljjj-cyber/mar-frontend

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
            TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
            TORCH_SPEC=torch==2.9.1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy over SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/multimodal_agentic_rag
            git fetch origin
            git reset --hard origin/newfrontend

            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            echo "IMAGE_TAG=$IMAGE_TAG" > .env.image
            if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
            else
              echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            fi

            docker compose pull backend frontend
            docker compose up -d
            sleep 10
            docker image prune -af
            curl -sf -o /dev/null http://127.0.0.1:8080/
            curl -sf http://127.0.0.1:8080/health
            echo "Smoke check OK"