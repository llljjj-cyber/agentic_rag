services:
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: Meridian-postgres-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: Meridian-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    container_name: Meridian-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # 单机演示先不绑宿主机数据目录，避免权限/路径踩坑

  backend:
    image: ghcr.io/llljjj-cyber/mar-backend:${IMAGE_TAG:-latest}
    build: .
    container_name: Meridian-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8897"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BGE_MODEL_PATH: /models/bge-m3
      ALLOWED_ORIGINS: http://8.138.96.81:8080,http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - ${BGE_MODEL_PATH_HOST}:/models/bge-m3:ro
      - ./backend/infrastructure/rag/temp/uploads:/app/backend/infrastructure/rag/temp/uploads
      - ${NLTK_DATA_HOST:-~/nltk_data}:/root/nltk_data
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  worker:
    image: ghcr.io/llljjj-cyber/mar-backend:${IMAGE_TAG:-latest}
    build: .
    container_name: Meridian-worker
    restart: unless-stopped
    command: ["python", "-m", "worker.source_consumer"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BGE_MODEL_PATH: /models/bge-m3
    volumes:
      - ${BGE_MODEL_PATH_HOST}:/models/bge-m3:ro
      - ./backend/infrastructure/rag/temp/uploads:/app/backend/infrastructure/rag/temp/uploads
      - ${NLTK_DATA_HOST:-~/nltk_data}:/root/nltk_data
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  frontend:
    image: ghcr.io/llljjj-cyber/mar-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    container_name: Meridian-frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: Meridian-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: Meridian-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
      - worker

  loki:
    image: grafana/loki:2.9.8
    container_name: Meridian-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    container_name: Meridian-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./deploy/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: Meridian-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki